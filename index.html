<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink & Equity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ink & Equity, advocates at Lucknow: practice areas by law and forum, people, notes and resources.">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<style>
/* Layout concept: a bound law report. Running head with status, headnote blocks, marginal notes,
   gold double rules. Brand kit: Ink Navy / Ivory / Champagne Gold / Fresh Teal / Slate, Cormorant Garamond + Jost. */
:root {
  --ink: #0B1F3A;
  --ivory: #F8F4EC;
  --gold: #C9A24B;
  --teal: #1FA5A0;
  --slate: #5B6675;

  --bg: #F8F4EC;
  --bg2: #EFE8D8;
  --bg3: #E5DCC7;
  --fg: #0B1F3A;
  --fg2: #4A5666;
  --rule: rgba(11, 31, 58, .2);
  --rule2: rgba(11, 31, 58, .1);
  --gold-deco: #C9A24B;
  --gold-ink: #7E6119;
  --teal-ink: #0C6D69;
  --card: #FFFDF8;
  --btn-bg: #0B1F3A;
  --btn-fg: #F8F4EC;
  --focus: #0C6D69;
  --warn-bg: #FBF0D5;
  --warn-fg: #6A4C08;

  --f-display: "Cormorant Garamond", "Noto Serif Devanagari", Georgia, "Times New Roman", serif;
  --f-body: "Jost", "Noto Sans Devanagari", "Segoe UI", system-ui, sans-serif;
  --lh: 1.65;
  --gut: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08162B; --bg2: #0D2240; --bg3: #14305A; --fg: #F1ECE0; --fg2: #AAB4C2;
    --rule: rgba(241, 236, 224, .22); --rule2: rgba(241, 236, 224, .1);
    --gold-deco: #D4AF5A; --gold-ink: #DDBC6B; --teal-ink: #4FD1CA; --card: #0D2240;
    --btn-bg: #D4AF5A; --btn-fg: #08162B; --focus: #4FD1CA; --warn-bg: #3A2F10; --warn-fg: #F0D58B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08162B; --bg2: #0D2240; --bg3: #14305A; --fg: #F1ECE0; --fg2: #AAB4C2;
  --rule: rgba(241, 236, 224, .22); --rule2: rgba(241, 236, 224, .1);
  --gold-deco: #D4AF5A; --gold-ink: #DDBC6B; --teal-ink: #4FD1CA; --card: #0D2240;
  --btn-bg: #D4AF5A; --btn-fg: #08162B; --focus: #4FD1CA; --warn-bg: #3A2F10; --warn-fg: #F0D58B;
  color-scheme: dark;
}
html[lang="hi"] {
  --f-display: "Tiro Devanagari Hindi", "Noto Serif Devanagari", "Cormorant Garamond", Georgia, serif;
  --f-body: "Noto Sans Devanagari", "Jost", "Segoe UI", system-ui, sans-serif;
  --lh: 1.9;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 17px; line-height: var(--lh);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .05 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
img, svg { max-width: 100%; }
a { color: var(--teal-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--btn-bg); color: var(--btn-fg); padding: 8px 14px; z-index: 100; }
.skip:focus { left: 8px; }
#app { position: relative; z-index: 1; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 500; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
html[lang="hi"] h1, html[lang="hi"] h2, html[lang="hi"] h3 { line-height: 1.35; letter-spacing: 0; }
p { margin: 0 0 1em; max-width: 68ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: 0; }

/* ---------- header ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.hdr-in { display: flex; align-items: center; gap: 18px; min-height: 64px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); background: none; border: 0; padding: 0; }
.brand .mark { font-family: var(--f-display); font-size: 30px; font-weight: 500; letter-spacing: .01em; }
.brand .mark i { color: var(--gold-ink); font-style: italic; padding: 0 2px; }
.brand small { font-size: 12px; color: var(--fg2); letter-spacing: .08em; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 8px 12px; font-size: 15px; position: relative; color: var(--fg); }
.nav button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 1px; background: var(--gold-deco); transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
.nav button:hover::after, .nav button[aria-current="page"]::after { transform: scaleX(1); }
.tools { display: flex; gap: 6px; align-items: center; }
.tbtn { border: 1px solid var(--rule); background: transparent; padding: 6px 11px; font-size: 13px; border-radius: 999px; min-height: 34px; }
.tbtn:hover { border-color: var(--gold-deco); }
.menu-btn { display: none; }
.prog { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--gold-deco); width: 0; }
@media (max-width: 900px) {
  .menu-btn { display: inline-flex; margin-left: auto; }
  .nav { display: none; width: 100%; flex-direction: column; margin-left: 0; order: 5; border-top: 1px solid var(--rule2); padding-top: 6px; }
  .nav.open { display: flex; }
  .nav button { text-align: left; padding: 12px 4px; }
  .tools { order: 4; }
}

/* ---------- running head ---------- */
.runhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; font-size: 13px; color: var(--fg2); border-bottom: 3px double var(--rule); }
.runhead .path button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.status { display: inline-flex; gap: 8px; align-items: center; background: var(--warn-bg); color: var(--warn-fg); padding: 2px 10px; border-radius: 999px; font-size: 12px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 32px; align-items: center; padding-block: 48px 40px; }
.hero h1 { font-size: clamp(44px, 7.2vw, 96px); font-weight: 500; line-height: 1.0; }
html[lang="hi"] .hero h1 { font-size: clamp(36px, 5.6vw, 76px); line-height: 1.25; }
.hero h1 .ln { display: block; overflow: hidden; }
.hero h1 .ln > span { display: inline-block; transform: translateY(105%); animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards; }
.hero h1 .ln:nth-child(2) > span { animation-delay: .14s; }
.hero h1 .ln:nth-child(3) > span { animation-delay: .28s; }
@keyframes rise { to { transform: none; } }
.hero h1 em { color: var(--gold-ink); }
.lede { font-size: 19px; color: var(--fg2); max-width: 54ch; margin-top: 22px; }
.hero-amp { width: 100%; aspect-ratio: 1 / 1; max-height: 560px; display: block; }
.hero-amp text { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--btn-bg); padding: 11px 20px; font-size: 15px; text-decoration: none; border-radius: 2px; transition: transform .15s ease, box-shadow .15s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--gold-deco); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--gold-deco); box-shadow: 0 4px 0 var(--gold-deco); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.fora-strip { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-block: 16px; border-block: 1px solid var(--rule); font-size: 14px; color: var(--fg2); }
.fora-strip b { font-weight: 500; color: var(--fg); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero-amp { max-height: 300px; order: -1; } }
@media (prefers-reduced-motion: reduce) { .hero h1 .ln > span { animation: none; transform: none; } * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- sections ---------- */
.sec { padding-block: 64px; }
.sec + .sec { border-top: 3px double var(--rule); }
.sec-h { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px; margin-bottom: 36px; align-items: end; }
.sec-h h2 { font-size: clamp(32px, 4.4vw, 58px); }
.sec-h p { color: var(--fg2); margin: 0; }
@media (max-width: 800px) { .sec-h { grid-template-columns: 1fr; gap: 12px; } .sec { padding-block: 44px; } }

/* two-column law report body */
.report { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 56px; padding-block: 40px 72px; }
.report > .main { min-width: 0; }
.marg { font-size: 14.5px; color: var(--fg2); border-left: 1px solid var(--gold-deco); padding-left: 18px; align-self: start; position: sticky; top: 96px; display: grid; gap: 22px; }
.marg h4 { font-family: var(--f-body); font-size: 12px; letter-spacing: .1em; font-weight: 600; color: var(--gold-ink); margin-bottom: 6px; text-transform: uppercase; }
html[lang="hi"] .marg h4 { letter-spacing: 0; text-transform: none; font-size: 14px; }
.marg p { margin: 0 0 6px; }
@media (max-width: 1000px) { .report { grid-template-columns: 1fr; gap: 28px; } .marg { position: static; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 20px; } }
.page-title { font-size: clamp(40px, 6vw, 80px); margin-bottom: 14px; }
html[lang="hi"] .page-title { font-size: clamp(32px, 5vw, 62px); }
.headnote { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--gold-deco); padding: 20px 24px; margin: 26px 0 34px; }
.headnote b { font-family: var(--f-display); font-size: 22px; font-weight: 600; display: block; margin-bottom: 6px; }
.headnote p { margin: 0; max-width: none; }
.h3 { font-size: 28px; margin: 38px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }

/* provisions table */
.prov { width: 100%; border-collapse: collapse; font-size: 15.5px; }
.prov th, .prov td { text-align: left; padding: 11px 14px 11px 0; vertical-align: top; border-bottom: 1px solid var(--rule2); }
.prov th { font-weight: 500; width: 40%; font-family: var(--f-display); font-size: 19px; }
.prov td small { display: block; color: var(--fg2); font-size: 13.5px; }
.table-scroll { overflow-x: auto; }
@media (max-width: 600px) { .prov th, .prov td { display: block; width: 100%; padding-right: 0; } .prov tr { display: block; border-bottom: 1px solid var(--rule2); padding: 8px 0; } .prov th, .prov td { border: 0; padding-block: 3px; } }

/* steps */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; position: relative; }
.steps li { counter-increment: s; position: relative; padding: 0 0 22px 56px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gold-deco); display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; background: var(--bg); z-index: 1; }
.steps li::after { content: ""; position: absolute; left: 19px; top: 38px; bottom: 0; width: 1px; background: var(--rule); }
.steps li:last-child::after { display: none; }
.steps b { display: block; font-weight: 500; font-size: 17px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; background: transparent; color: var(--fg); }
button.chip:hover, button.chip[aria-pressed="true"] { border-color: var(--gold-deco); background: var(--bg2); }
.pill { display: inline-block; border: 1px solid var(--teal-ink); color: var(--teal-ink); border-radius: 3px; padding: 0 8px; font-size: 12.5px; }

/* ---------- practice index (home) ---------- */
.pidx { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 48px; }
.pidx ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.pidx li button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 8px 14px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--f-display); font-size: 26px; line-height: 1.2; transition: padding .2s ease, color .2s ease; }
html[lang="hi"] .pidx li button { font-size: 21px; }
.pidx li button span { font-family: var(--f-body); font-size: 13px; color: var(--fg2); text-align: right; }
.pidx li button:hover, .pidx li button.on { padding-left: 14px; color: var(--gold-ink); }
.pprev { position: sticky; top: 100px; align-self: start; background: var(--card); border: 1px solid var(--rule); padding: 26px; min-height: 280px; }
.pprev h3 { font-size: 32px; margin-bottom: 10px; }
.pprev p { font-size: 15.5px; color: var(--fg2); }
@media (max-width: 900px) { .pidx { grid-template-columns: 1fr; } .pprev { position: static; } }

/* people */
.ppl { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
.person { text-align: left; background: var(--card); border: 1px solid var(--rule); padding: 22px; display: grid; gap: 14px; transition: border-color .2s ease, transform .2s ease; }
.person:hover { border-color: var(--gold-deco); transform: translateY(-2px); }
.mono { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--gold); font-family: var(--f-display); font-size: 34px; font-style: italic; position: relative; }
:root[data-theme="dark"] .mono { background: var(--bg3); }
.mono::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid var(--gold-deco); opacity: .7; }
.person h3 { font-size: 26px; }
.person small { color: var(--fg2); font-size: 14px; }

/* frames: slots for material that only people can supply */
.frame { border: 1.5px dashed var(--rule); padding: 18px 20px; color: var(--fg2); font-size: 15px; background: repeating-linear-gradient(135deg, transparent 0 11px, var(--rule2) 11px 12px); }
.frame b { color: var(--fg); font-weight: 500; display: block; }

/* notes */
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.note { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 22px 22px 22px 0; display: grid; gap: 8px; align-content: start; }
.note:hover h3 { color: var(--gold-ink); }
.note h3 { font-size: 27px; transition: color .2s ease; }
.note small { color: var(--fg2); }
.article p { font-size: 18px; max-width: 64ch; }
.article > p:first-of-type::first-letter { font-family: var(--f-display); float: left; font-size: 4.2em; line-height: .8; padding: 6px 10px 0 0; color: var(--gold-ink); }
html[lang="hi"] .article > p:first-of-type::first-letter { all: unset; }
.cite { border: 1px solid var(--rule); background: var(--card); padding: 14px 18px; font-size: 14.5px; margin: 20px 0; }
.cite ul { margin: 6px 0 0; padding-left: 18px; }
.cite li { margin-bottom: 4px; }

/* fora ladder */
.streams { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.ladder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 44px; }
.rungs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 0; position: relative; }
.rungs li { position: relative; }
.rungs button { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--rule); padding: 14px 16px; display: grid; gap: 2px; margin-bottom: 14px; transition: border-color .2s ease, transform .2s ease; }
.rungs li:not(:first-child) button::after { content: ""; position: absolute; left: 22px; bottom: -14px; height: 14px; width: 1px; background: var(--gold-deco); }
.rungs button b { font-family: var(--f-display); font-size: 23px; font-weight: 500; line-height: 1.2; }
.rungs button span { font-size: 13.5px; color: var(--fg2); }
.rungs button:hover, .rungs button[aria-pressed="true"] { border-left-color: var(--gold-deco); transform: translateX(4px); }
.rungs button[aria-pressed="true"] { background: var(--bg2); }
.rung-detail { background: var(--card); border: 1px solid var(--rule); padding: 28px; align-self: start; position: sticky; top: 100px; }
.rung-detail h3 { font-size: 32px; margin-bottom: 12px; }
@media (max-width: 900px) { .ladder { grid-template-columns: 1fr; } .rung-detail { position: static; } }

/* limitation */
.ltools { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.ltools input { flex: 1 1 260px; border: 1px solid var(--rule); background: var(--card); color: var(--fg); padding: 11px 14px; font: inherit; border-radius: 2px; }
.q { background: var(--card); border: 1px solid var(--rule); padding: 24px; margin-top: 24px; }
.q h3 { font-size: 26px; margin-bottom: 14px; }
.opts { display: grid; gap: 8px; }
.opts button { text-align: left; background: transparent; border: 1px solid var(--rule); padding: 10px 14px; border-radius: 2px; }
.opts button:hover:not([disabled]) { border-color: var(--gold-deco); }
.opts button.ok { border-color: var(--teal-ink); background: color-mix(in srgb, var(--teal) 14%, transparent); }
.opts button.no { border-color: #B3402F; background: color-mix(in srgb, #B3402F 10%, transparent); }
.why { margin-top: 12px; font-size: 15px; color: var(--fg2); }

/* forms */
.form { display: grid; gap: 16px; max-width: 640px; }
.form label { display: grid; gap: 5px; font-size: 14.5px; }
.form input, .form select, .form textarea { border: 1px solid var(--rule); background: var(--card); color: var(--fg); padding: 11px 13px; font: inherit; border-radius: 2px; width: 100%; }
.form textarea { min-height: 130px; resize: vertical; }
.form .chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.form .chk input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.err { color: #B3402F; font-size: 13.5px; min-height: 1em; }
:root[data-theme="dark"] .err { color: #FF8F7C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #FF8F7C; } }
.preview { background: var(--card); border: 1px solid var(--rule); padding: 18px; white-space: pre-wrap; font-size: 15px; margin-top: 18px; }

/* resources */
.fam { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
.famc { background: var(--card); border: 1px solid var(--rule); padding: 24px; display: grid; gap: 10px; align-content: start; position: relative; overflow: hidden; }
.famc::before { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; border: 1px solid var(--gold-deco); opacity: .5; }
.famc h3 { font-size: 28px; }
.famc small { color: var(--fg2); }

/* client room */
.room { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 30px; }
.room .login { background: var(--ink); color: var(--ivory); padding: 26px; display: grid; gap: 14px; align-content: start; }
.room .login input { background: transparent; border: 1px solid rgba(248, 244, 236, .4); color: var(--ivory); padding: 10px 12px; font: inherit; }
.room .panes { display: grid; gap: 16px; }
@media (max-width: 800px) { .room { grid-template-columns: 1fr; } }

/* palette */
.pal-bg { position: fixed; inset: 0; z-index: 90; background: rgba(8, 22, 43, .6); display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.pal-bg.open { display: flex; }
.pal { width: min(620px, 100%); background: var(--bg); border: 1px solid var(--gold-deco); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.pal input { width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--fg); font: inherit; font-size: 19px; padding: 16px 18px; outline: none; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.pal li button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; display: flex; justify-content: space-between; gap: 12px; }
.pal li button.on, .pal li button:hover { background: var(--bg2); }
.pal li small { color: var(--fg2); }

/* footer */
.ftr { background: var(--ink); color: #E9E3D3; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 56px max(16px, env(safe-area-inset-right, 0px)) 36px max(16px, env(safe-area-inset-left, 0px)); margin-top: 40px; }
:root[data-theme="dark"] .ftr { background: #050E1D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ftr { background: #050E1D; } }
.ftr a { color: #E6C877; }
.ftr .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; }
.ftr h4 { font-family: var(--f-body); font-size: 12px; letter-spacing: .12em; font-weight: 600; color: #C9A24B; margin-bottom: 10px; text-transform: uppercase; }
html[lang="hi"] .ftr h4 { letter-spacing: 0; text-transform: none; font-size: 14px; }
.ftr p, .ftr li { font-size: 14.5px; margin: 0 0 6px; color: #CFC8B6; }
.ftr ul { list-style: none; padding: 0; margin: 0; }
.ftr .fine { border-top: 1px solid rgba(248, 244, 236, .2); margin-top: 32px; padding-top: 22px; font-size: 13px; color: #A9A491; max-width: 90ch; }
.ftr button.lnk { background: none; border: 0; padding: 0; color: #E6C877; text-decoration: underline; text-underline-offset: 3px; text-align: left; font-size: 14.5px; }
.ftr .brand { color: #F8F4EC; }
.ftr .brand .mark i { color: #D4AF5A; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ivory); padding: 10px 18px; border: 1px solid var(--gold-deco); z-index: 99; font-size: 14.5px; }
.toast[hidden] { display: none; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 18px; font-size: 15.5px; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; gap: 0; } .kv dd { margin-bottom: 10px; } }

    title: L('Mutation is not title', 'दाखिल-खारिज स्वत्व नहीं है'),
    dek: L('What a khatauni entry proves, what it does not, and where title is actually decided.', 'खतौनी की प्रविष्टि क्या सिद्ध करती है, क्या नहीं, और स्वत्व वास्तव में कहाँ तय होता है।'),
    body: [
      L('In Uttar Pradesh, a name entered in the khatauni after mutation is often treated as proof of ownership. The courts do not treat it that way. Mutation is a record kept for fiscal purposes: it shows who is to pay the land revenue and who is in possession according to the record. It does not decide who owns the land.',
        'उत्तर प्रदेश में दाखिल-खारिज के बाद खतौनी में दर्ज नाम को अक्सर स्वामित्व का प्रमाण मान लिया जाता है। न्यायालय ऐसा नहीं मानते। दाखिल-खारिज राजकोषीय प्रयोजन का अभिलेख है: यह बताता है कि भू-राजस्व कौन देगा और अभिलेख के अनुसार कब्ज़ा किसका है। यह तय नहीं करता कि भूमि का स्वामी कौन है।'),
      L('The Supreme Court has said this repeatedly. In Sawarni v. Inder Kaur it held that mutation proceedings are summary and neither create nor extinguish title. Balwant Singh v. Daulat Singh repeated that an entry in the revenue record carries no presumption of title. Suraj Bhan v. Financial Commissioner applied the same view and added that such an entry does not confer title on the person named.',
        'सर्वोच्च न्यायालय ने यह बात बार-बार कही है। सावर्णी बनाम इंदर कौर में कहा गया कि दाखिल-खारिज की कार्यवाही संक्षिप्त है और स्वत्व न बनाती है, न समाप्त करती है। बलवंत सिंह बनाम दौलत सिंह में दोहराया गया कि राजस्व अभिलेख की प्रविष्टि से स्वत्व की कोई उपधारणा नहीं बनती। सूरज भान बनाम वित्तीय आयुक्त में यही दृष्टिकोण अपनाया गया और जोड़ा गया कि ऐसी प्रविष्टि नामित व्यक्ति को स्वत्व प्रदान नहीं करती।'),
      L('Under the Uttar Pradesh Revenue Code, 2006 the sequence is statutory. A person who takes possession by succession reports it to the Revenue Inspector under section 33. A person who takes possession by transfer reports it to the Tahsildar under section 34. The Tahsildar acts under section 35 after a proclamation and inquiry, and an appeal lies to the Sub-Divisional Officer within 30 days. Section 37 bars a suit or proceeding in a revenue court until the report is made.',
        'उत्तर प्रदेश राजस्व संहिता, 2006 में क्रम वैधानिक है। उत्तराधिकार से कब्ज़ा पाने वाला धारा 33 के अधीन राजस्व निरीक्षक को रिपोर्ट करता है। अंतरण से कब्ज़ा पाने वाला धारा 34 के अधीन तहसीलदार को रिपोर्ट करता है। तहसीलदार उद्घोषणा और जाँच के बाद धारा 35 के अधीन कार्रवाई करता है, और उप-जिलाधिकारी को 30 दिन में अपील होती है। रिपोर्ट किए जाने तक धारा 37 राजस्व न्यायालय में वाद या कार्यवाही को वर्जित करती है।'),
      L('The practical point is that a mutation order does not settle a title dispute, and the absence of one does not end a title. A party whose rights rest on a sale deed, a will or a decree should keep those documents in order. Where title is genuinely in dispute, the remedy that decides it is needed, such as a declaratory suit: under section 144 a person claiming to be a bhumidhar or asami may sue for a declaration of rights in the holding. Mutation still matters, because a person who is not in the record meets practical obstacles in dealing with the land.',
        'व्यावहारिक बात यह है कि दाखिल-खारिज का आदेश स्वत्व विवाद का निपटारा नहीं करता, और उसका अभाव स्वत्व समाप्त नहीं करता। जिसके अधिकार विक्रय-पत्र, वसीयत या डिक्री पर टिके हों, वह उन दस्तावेज़ों को व्यवस्थित रखे। जहाँ स्वत्व वास्तव में विवादित हो, वहाँ उसे तय करने वाला उपचार चाहिए, जैसे घोषणात्मक वाद: धारा 144 के अधीन भूमिधर या आसामी होने का दावा करने वाला जोत में अधिकारों की घोषणा के लिए वाद कर सकता है। दाखिल-खारिज फिर भी महत्त्वपूर्ण है, क्योंकि अभिलेख में नाम न होने पर भूमि के लेन-देन में व्यावहारिक बाधाएँ आती हैं।')
    ],
    src: [
      ['Sawarni v. Inder Kaur, (1996) 6 SCC 223', null],
      ['Balwant Singh v. Daulat Singh, (1997) 7 SCC 137', null],
      ['Suraj Bhan v. Financial Commissioner, (2007) 6 SCC 186', null],
      ['Uttar Pradesh Revenue Code, 2006, ss. 33, 34, 35, 37, 144', 'http://uprevenuecode.com/home/section_details/53']
    ]
  },
  {
    slug: 'writ-and-alternative-remedy', date: '2026-10-24', area: 'constitutional',
    title: L('The writ and the alternative remedy', 'रिट और वैकल्पिक उपचार'),
    dek: L('Why a High Court may refuse to hear a writ when an appeal exists, and the exceptions.', 'अपील उपलब्ध होने पर उच्च न्यायालय रिट सुनने से क्यों मना कर सकता है, और अपवाद क्या हैं।'),
    body: [
      L('A High Court has power under Article 226 to issue writs. It also follows a rule of its own making: it will ordinarily not entertain a writ petition where an effective alternative remedy exists. The rule is one of discretion. It is not a bar on the power.',
        'उच्च न्यायालय को अनुच्छेद 226 के अधीन रिट जारी करने की शक्ति है। वह स्वयं बनाए एक नियम का भी पालन करता है: जहाँ प्रभावी वैकल्पिक उपचार हो, वहाँ वह सामान्यतः रिट याचिका स्वीकार नहीं करता। यह नियम विवेक का है। यह शक्ति पर रोक नहीं है।'),
      L('In Whirlpool Corporation v. Registrar of Trade Marks the Supreme Court listed the situations in which a writ may be entertained despite an alternative remedy: enforcement of a fundamental right, violation of the principles of natural justice, an order or proceeding wholly without jurisdiction, and a challenge to the vires of an Act. Harbanslal Sahnia v. Indian Oil Corporation Ltd followed it and described the rule as one of self-imposed restraint.',
        'व्हर्लपूल कॉरपोरेशन बनाम रजिस्ट्रार ऑफ ट्रेड मार्क्स में सर्वोच्च न्यायालय ने वे स्थितियाँ गिनाईं जिनमें वैकल्पिक उपचार होने पर भी रिट स्वीकार हो सकती है: मौलिक अधिकार का प्रवर्तन, नैसर्गिक न्याय के सिद्धांतों का उल्लंघन, पूरी तरह क्षेत्राधिकार-रहित आदेश या कार्यवाही, और किसी अधिनियम की वैधता को चुनौती। हरबंसलाल साहनिया बनाम इंडियन ऑयल कॉरपोरेशन ने इसका अनुसरण किया और इसे स्व-आरोपित संयम का नियम बताया।'),
      L('In tax matters the Court has been firm. In Commissioner of Income Tax v. Chhabil Dass Agarwal it held that where a statute provides a complete machinery of appeal, the High Court should not ordinarily bypass it, and that the petitioner must show an exceptional circumstance.',
        'कर मामलों में न्यायालय दृढ़ रहा है। आयकर आयुक्त बनाम छबिल दास अग्रवाल में कहा गया कि जहाँ कानून अपील की पूर्ण व्यवस्था देता है, वहाँ उच्च न्यायालय को सामान्यतः उसे लाँघना नहीं चाहिए, और याचिकाकर्ता को असाधारण परिस्थिति दिखानी होगी।'),
      L('For a litigant the lesson is to read the order first for the remedy it points to. If a statutory appeal exists, use it within time. If a writ is still the right course, the petition should say why in the grounds, by reference to one of the recognised exceptions.',
        'वादकारी के लिए सीख यह है कि पहले आदेश में यह देखें कि वह किस उपचार की ओर इंगित करता है। यदि वैधानिक अपील है तो समय के भीतर उसका प्रयोग करें। यदि रिट फिर भी सही मार्ग है, तो याचिका के आधारों में मान्य अपवादों में से किसी का हवाला देकर कारण बताना चाहिए।')
    ],
    src: [
      ['Whirlpool Corporation v. Registrar of Trade Marks, (1998) 8 SCC 1', null],
      ['Harbanslal Sahnia v. Indian Oil Corporation Ltd, (2003) 2 SCC 107', null],
      ['Commissioner of Income Tax v. Chhabil Dass Agarwal, (2014) 1 SCC 603', null],
      ['Constitution of India, Art. 226', null]
    ]
  },
  {
    slug: 'counting-limitation', date: '2026-10-24', area: 'civil',
    title: L('Counting limitation without surprises', 'परिसीमा बिना चूक के गिनना'),
    dek: L('Five provisions that change the count, and one case where extension is not available.', 'पाँच प्रावधान जो गणना बदलते हैं, और एक मामला जिसमें विस्तार उपलब्ध नहीं।'),
    body: [
      L('Limitation is counted from the day the right to sue or appeal accrues, and the period is fixed by the Schedule to the Limitation Act, 1963. Article 113 supplies three years for any suit for which no period is provided elsewhere.',
        'परिसीमा उस दिन से गिनी जाती है जब वाद या अपील का अधिकार उत्पन्न होता है, और अवधि परिसीमा अधिनियम, 1963 की अनुसूची से तय होती है। अनुच्छेद 113 उन सभी वादों के लिए तीन वर्ष देता है जिनके लिए अन्यत्र अवधि न दी गई हो।'),
      L('Five provisions change the count in practice. Section 12 excludes the day of the order appealed from and the time needed to obtain a copy. Section 14 excludes time spent in good faith in a court that had no jurisdiction. Sections 18 and 19 start a fresh period when liability is acknowledged in writing or a part payment is made before the period expires. Section 5 allows delay in an appeal or application to be condoned for sufficient cause, but it does not apply to suits.',
        'व्यवहार में पाँच प्रावधान गणना बदलते हैं। धारा 12 जिस आदेश की अपील है उसका दिन और प्रति पाने में लगा समय अपवर्जित करती है। धारा 14 अधिकारहीन न्यायालय में सद्भाव से लगा समय अपवर्जित करती है। धारा 18 और 19 अवधि समाप्त होने से पहले दायित्व की लिखित स्वीकृति या आंशिक भुगतान होने पर नई अवधि आरंभ करती हैं। धारा 5 अपील या आवेदन में विलंब को पर्याप्त कारण पर क्षमा करने देती है, पर वादों पर लागू नहीं होती।'),
      L('Some statutes carry their own limit and exclude section 5. In Union of India v. Popular Construction Co. the Supreme Court held that section 5 does not apply to an application to set aside an arbitral award, because section 34(3) of the Arbitration and Conciliation Act, 1996 fixes three months and allows only a further thirty days.',
        'कुछ कानूनों की अपनी सीमा होती है और वे धारा 5 को बाहर रखते हैं। यूनियन ऑफ इंडिया बनाम पॉपुलर कंस्ट्रक्शन कंपनी में सर्वोच्च न्यायालय ने कहा कि पंचाट को अपास्त करने के आवेदन पर धारा 5 लागू नहीं होती, क्योंकि मध्यस्थता और सुलह अधिनियम, 1996 की धारा 34(3) तीन माह देती है और केवल तीस दिन और।'),
      L('A reliable habit is to write the dates down at the first meeting: the date of the order, the date the copy was applied for, the date it was received and the date the period ends. The limitation reference on this site lists the common periods, each with its provision.',
        'एक भरोसेमंद आदत है पहली बैठक में ही तिथियाँ लिख लेना: आदेश की तिथि, प्रति के लिए आवेदन की तिथि, प्रति मिलने की तिथि और अवधि समाप्त होने की तिथि। इस साइट का परिसीमा संदर्भ सामान्य अवधियों को उनके प्रावधान सहित देता है।')
    ],
    src: [
      ['Limitation Act, 1963, ss. 3, 5, 12, 14, 18, 19 and Art. 113', null],
      ['Union of India v. Popular Construction Co., (2001) 8 SCC 470', null],
      ['Arbitration and Conciliation Act, 1996, s. 34(3)', null]
    ]
  },
  {
    slug: 'bail-under-bnss', date: '2026-10-24', area: 'criminal',
    title: L('Bail under the BNSS: where to look', 'बीएनएसएस में जमानत: कहाँ देखें'),
    dek: L('The sections that moved, two Supreme Court decisions on arrest and anticipatory bail, and a drafting habit.', 'जो धाराएँ बदलीं, गिरफ़्तारी और अग्रिम जमानत पर सर्वोच्च न्यायालय के दो निर्णय, और प्रारूपण की एक आदत।'),
    body: [
      L('The Bharatiya Nagarik Suraksha Sanhita, 2023 replaced the Code of Criminal Procedure from 1 July 2024. The bail provisions kept their structure but were renumbered.',
        'भारतीय नागरिक सुरक्षा संहिता, 2023 ने 1 जुलाई 2024 से दंड प्रक्रिया संहिता का स्थान लिया। जमानत के प्रावधानों की संरचना वही रही, पर उनके क्रमांक बदल गए।'),
      L('Section 480 deals with bail in non-bailable offences. Section 482 deals with anticipatory bail, a direction to release a person on bail if arrested. Section 483 gives special powers on bail to the High Court and the Court of Session. Section 479 limits the detention of undertrial prisoners: a person who has served a stated fraction of the maximum sentence may be released on bail, with a lower fraction for a first offender. The fractions and the exceptions are in the section itself.',
        'धारा 480 अजमानतीय अपराधों में जमानत से संबंधित है। धारा 482 अग्रिम जमानत से संबंधित है, यानी गिरफ़्तारी की स्थिति में जमानत पर छोड़ने का निर्देश। धारा 483 उच्च न्यायालय और सत्र न्यायालय को जमानत की विशेष शक्तियाँ देती है। धारा 479 विचाराधीन बंदियों की निरुद्धि सीमित करती है: अधिकतम दंड का निर्धारित अंश भोग चुका व्यक्ति जमानत पर छोड़ा जा सकता है, प्रथम अपराधी के लिए छोटा अंश। अंश और अपवाद धारा में ही हैं।'),
      L('On arrest, section 35 requires the police, in the cases it lists, to issue a notice of appearance rather than arrest. In Arnesh Kumar v. State of Bihar the Supreme Court held that arrest should not be automatic in offences punishable up to seven years, and that the police must record their reasons.',
        'गिरफ़्तारी के समय धारा 35 उन मामलों में, जो उसमें गिनाए गए हैं, पुलिस से गिरफ़्तारी के बजाय उपस्थिति का नोटिस जारी करने की अपेक्षा करती है। अरनेश कुमार बनाम बिहार राज्य में सर्वोच्च न्यायालय ने कहा कि सात वर्ष तक के दंडनीय अपराधों में गिरफ़्तारी स्वतः नहीं होनी चाहिए, और पुलिस को कारण दर्ज करने होंगे।'),
      L('In Sushila Aggarwal v. State (NCT of Delhi) the Court held that anticipatory bail need not, as a rule, be limited in time, though a court may impose conditions in a given case.',
        'सुशीला अग्रवाल बनाम राज्य (दिल्ली) में न्यायालय ने कहा कि अग्रिम जमानत सामान्यतः समय-सीमित होना आवश्यक नहीं, यद्यपि किसी मामले में न्यायालय शर्तें लगा सकता है।'),
      L('In any new application, cite the section numbers of the Sanhita. Mention the Code equivalent only where an older judgment is relied on.',
        'किसी भी नए आवेदन में संहिता की धारा संख्याएँ उद्धृत करें। पुरानी संहिता का समतुल्य केवल तभी बताएँ जब किसी पुराने निर्णय पर भरोसा हो।')
    ],
    src: [
      ['Bharatiya Nagarik Suraksha Sanhita, 2023, ss. 35, 479, 480, 482, 483', null],
      ['Arnesh Kumar v. State of Bihar, (2014) 8 SCC 273', null],
      ['Sushila Aggarwal v. State (NCT of Delhi), (2020) 5 SCC 1', null]
    ]
  },
  {
    slug: 'which-income-tax-act', date: '2026-10-24', area: 'tax',
    title: L('Which Income-tax Act does my notice come under?', 'मेरा नोटिस किस आयकर अधिनियम के अधीन है?'),
    dek: L('The year decides the Act, and the Act decides the section numbers.', 'वर्ष तय करता है कि कौन सा अधिनियम, और अधिनियम तय करता है कि कौन सी धारा।'),
    body: [
      L('The Income-tax Act, 2025 came into force on 1 April 2026. It has 536 sections against the 819 of the 1961 Act, and it applies from Tax Year 2026-27 onward. Earlier years, including financial year 2025-26, continue under the 1961 Act.',
        'आयकर अधिनियम, 2025 1 अप्रैल 2026 से लागू हुआ। इसमें 536 धाराएँ हैं, जबकि 1961 के अधिनियम में 819 थीं, और यह कर वर्ष 2026-27 से लागू है। पूर्व वर्ष, वित्त वर्ष 2025-26 सहित, 1961 के अधिनियम के अधीन चलते हैं।'),
      L('A notice received now can therefore cite either Act, and the section numbers differ. The return of income, section 139 of the old Act, is section 263 of the new one. The new tax regime, section 115BAC, is section 202. One source reports reassessment, sections 147 to 151A, as section 279 and marks it for verification. For other sections published tables disagree, so check the enacted text and the concordance notified by the Central Board of Direct Taxes.',

  ${frame(t(L('Proposed firm policy, not yet adopted', 'प्रस्तावित फर्म नीति, अभी अपनाई नहीं गई')), t(L('Every citation in a draft is checked against a public report before it leaves the firm. Client documents are not entered into public AI tools. Material AI use is disclosed. The partners are to confirm or change this text.', 'प्रारूप का हर उद्धरण फर्म से बाहर जाने से पहले सार्वजनिक रिपोर्ट से मिलाया जाता है। मुवक्किल के दस्तावेज़ सार्वजनिक एआई उपकरणों में नहीं डाले जाते। सारभूत एआई उपयोग का प्रकटीकरण होता है। भागीदार इस पाठ की पुष्टि करेंगे या बदलेंगे।')))}
  <h2 class="h3">${esc(t(L('Accessibility', 'सुगम्यता')))}</h2>
  <p>${esc(t(L('The site works with a keyboard, respects reduced-motion settings, and offers light and dark themes and English and Hindi.', 'साइट कीबोर्ड से चलती है, कम-गति सेटिंग का सम्मान करती है, और हल्की व गहरी थीम तथा अंग्रेज़ी और हिंदी देती है।')))}</p>`, null);
}

function currentView() {
  const r = S.route;
  if (r === 'home') return vHome();
  if (r === 'about') return vAbout();
  if (r === 'practice') return vPractice();
  if (r.startsWith('practice-')) return vPracticeOne(r.slice(9));
  if (r === 'fora') return vFora();
  if (r === 'limitation') return vLimitation();
  if (r === 'lexicon') return vLexicon();
  if (r === 'people') return vPeople();
  if (r.startsWith('person-')) return vPerson(r.slice(7));
  if (r === 'notes') return vNotes();
  if (r.startsWith('note-')) return vNote(r.slice(5));
  if (r === 'resources') return vResources();
  if (r === 'clientroom') return vClientRoom();
  if (r === 'contact') return vContact();
  if (r === 'notices') return vNotices();
  return vHome();
}

/* App: render, router, events, palette, hero animation */
function render() {
  const app = document.getElementById('app');
  const v = currentView();
  app.innerHTML = header() + (S.route === 'home' ? v : `<main id="main">${v}</main>`) + footer();
  document.documentElement.lang = S.lang;
  afterRender();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function afterRender() { if (S.route === 'home') inkIn(); onScroll(); }
function go(route) {
  if (!ROUTES.includes(route)) route = 'home';
  S.route = route; S.menu = false;
  render(); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + route); } catch (e) {}
}
function setLang(l) {
  S.lang = l === 'hi' ? 'hi' : 'en';
  try { localStorage.setItem('ieq-lang', S.lang); } catch (e) {}
  rerender();
}
window.go = go; window.setLang = setLang; window.__routes = ROUTES;

function inkIn() {
  const d = document.getElementById('inkdisp'); if (!d) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { d.setAttribute('scale', '0'); return; }
  const dur = 2600; let st = null; d.setAttribute('scale', '80');
  const step = ts => { if (!st) st = ts; const k = Math.min(1, (ts - st) / dur); const e = 1 - Math.pow(1 - k, 3); d.setAttribute('scale', String(80 * (1 - e))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function onScroll() {
  const p = document.getElementById('prog'); if (!p) return;
  const h = document.documentElement.scrollHeight - window.innerHeight;
  p.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
}
window.addEventListener('scroll', onScroll, { passive: true });

let toastT;
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200);
}
function copyText(txt) {
  const done = () => toast(t(L('Copied', 'कॉपी हुआ')));
  const fail = () => toast(t(L('Copy did not work. Select the text and copy it.', 'कॉपी नहीं हुआ। पाठ चुनकर कॉपी करें।')));
  try { navigator.clipboard.writeText(txt).then(done, fail); } catch (e) { fail(); }
}

/* ---------- palette ---------- */
let palSel = 0, palList = [];
function palItems() {
  const items = [], add = (r, l, sub) => items.push({ r, l: t(l), sub: t(sub || '') });
  add('home', L('Home', 'मुख्य')); add('about', L('About the firm', 'फर्म के बारे में')); add('practice', L('Practice areas', 'कार्यक्षेत्र'));
  PRACTICE.forEach(p => add('practice-' + p.slug, p.name, p.short));
  add('fora', L('Forum ladders', 'न्यायालय-क्रम')); add('limitation', L('Limitation reference', 'परिसीमा संदर्भ')); add('lexicon', L('Lexicon', 'शब्दकोश'));
  LEX.forEach(x => add('lexicon', { en: x.t, hi: x.t }, x.m));
  LIM.forEach(r => add('limitation', r.what, { en: r.ref + ' · ' + r.per.en, hi: r.ref + ' · ' + r.per.hi }));
  PEOPLE.forEach(p => add('person-' + p.slug, { en: p.name, hi: p.name }, p.role));
  NOTES.forEach(n => add('note-' + n.slug, n.title, L('Note', 'टिप्पणी')));
  add('resources', L('Resources', 'संसाधन')); add('clientroom', L('Client Room', 'क्लाइंट रूम')); add('contact', L('Contact', 'संपर्क')); add('notices', L('Notices', 'सूचनाएँ'));
  return items;
}
function palFilter() {
  const q = document.getElementById('palq').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  palList = palItems().filter(i => q.every(w => (i.l + ' ' + i.sub).toLowerCase().includes(w))).slice(0, 14);
  palSel = 0; palDraw();
}
function palDraw() {
  document.getElementById('pall').innerHTML = palList.length ? palList.map((i, k) => `<li><button class="${k === palSel ? 'on' : ''}" data-pal="${k}"><span>${esc(i.l)}</span><small>${esc(i.sub)}</small></button></li>`).join('') : `<li style="padding:14px;color:var(--fg2)">${esc(t(L('Nothing matches. Try one word, such as “mutation” or “bail”.', 'कुछ नहीं मिला। एक शब्द आज़माएँ, जैसे “दाखिल-खारिज” या “जमानत”।')))}</li>`;
}
function openPal() {
  const bg = document.getElementById('palbg'); bg.classList.add('open');
  const q = document.getElementById('palq'); q.value = ''; q.placeholder = t(L('Search pages, practice areas, periods, notes', 'पृष्ठ, कार्यक्षेत्र, अवधियाँ, टिप्पणियाँ खोजें')); palFilter(); q.focus();
}
function closePal() { document.getElementById('palbg').classList.remove('open'); }
function palGo(k) { const it = palList[k]; if (!it) return; closePal(); go(it.r); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'palbg') { closePal(); return; }
  const pb = e.target.closest('[data-pal]'); if (pb) { palGo(+pb.dataset.pal); return; }
  const el = e.target.closest('[data-go],[data-act]'); if (!el) return;
  if (el.dataset.go) { go(el.dataset.go); return; }
  const a = el.dataset.act, arg = el.dataset.arg;
  if (a === 'lang') setLang(S.lang === 'en' ? 'hi' : 'en');
  else if (a === 'theme') {
    const r = document.documentElement;
    const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark ? 'light' : 'dark';
  }
  else if (a === 'menu') { S.menu = !S.menu; document.getElementById('nav').classList.toggle('open', S.menu); el.setAttribute('aria-expanded', S.menu); }
  else if (a === 'palette') openPal();
  else if (a === 'skip') { e.preventDefault(); const m = document.getElementById('main'); if (m) { m.setAttribute('tabindex', '-1'); m.focus(); } }
  else if (a === 'stream') { S.stream = arg; S.rung = 0; rerender(); }
  else if (a === 'rung') { S.rung = +arg; rerender(); }
  else if (a === 'limarea') { S.limArea = arg; rerender(); }
  else if (a === 'quizans') { const Q = S.quiz; if (Q.ans === null) { Q.ans = +arg; if (Q.ans === QUIZ[Q.i].a) Q.score++; document.getElementById('quiz').innerHTML = quizBlock(); } }
  else if (a === 'quiznext') { const Q = S.quiz; if (Q.i === QUIZ.length - 1) Q.done = true; else { Q.i++; Q.ans = null; } document.getElementById('quiz').innerHTML = quizBlock(); }
  else if (a === 'quizreset') { S.quiz = { i: 0, ans: null, score: 0, done: false }; document.getElementById('quiz').innerHTML = quizBlock(); }
  else if (a === 'lexg') { S_lex.g = arg; rerender(); }
  else if (a === 'copy') copyText(arg);
});
document.addEventListener('input', e => {
  if (e.target.id === 'limq') { S.limQ = e.target.value; document.getElementById('limtable').innerHTML = limTable(); }
  if (e.target.id === 'lexq') { S_lex.q = e.target.value; document.getElementById('lexgrid').innerHTML = lexGrid(); }
  if (e.target.id === 'palq') palFilter();
});
function hoverPP(e) {
  const b = e.target.closest('[data-hpp]'); if (!b) return;
  const i = +b.dataset.hpp; if (i === S.pp) return; S.pp = i;
  document.getElementById('pprev').innerHTML = ppView(PRACTICE[i]);
  document.querySelectorAll('[data-hpp]').forEach(x => x.classList.toggle('on', +x.dataset.hpp === i));
}
document.addEventListener('mouseover', hoverPP);
document.addEventListener('focusin', hoverPP);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return; }
  const open = document.getElementById('palbg').classList.contains('open');
  if (!open) return;
  if (e.key === 'Escape') closePal();
  else if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palList.length - 1, palSel + 1); palDraw(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palDraw(); }
  else if (e.key === 'Enter') { e.preventDefault(); palGo(palSel); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'cform') return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const set = (id, m) => { document.getElementById(id).textContent = m; };
  const name = v('f-name'), phone = v('f-phone'), email = v('f-email'), msg = v('f-msg'), topic = document.getElementById('f-topic').value;
  const ok = document.getElementById('f-consent').checked;
  let bad = false;
  set('e-name', ''); set('e-contact', ''); set('e-msg', ''); set('e-consent', '');
  if (!name) { set('e-name', t(L('Enter your name.', 'अपना नाम लिखें।'))); bad = true; }
  if (!phone && !email) { set('e-contact', t(L('Enter a phone number or an email so the firm can reply.', 'उत्तर के लिए फ़ोन नंबर या ईमेल लिखें।'))); bad = true; }
  if (email && !/^\S+@\S+\.\S+$/.test(email)) { set('e-contact', t(L('That email looks incomplete.', 'यह ईमेल अधूरा लगता है।'))); bad = true; }
  if (!msg) { set('e-msg', t(L('Write a few lines about your message.', 'अपने संदेश के बारे में कुछ पंक्तियाँ लिखें।'))); bad = true; }
  if (!ok) { set('e-consent', t(L('Tick the box to agree before preparing the message.', 'संदेश तैयार करने से पहले सहमति के लिए बॉक्स पर टिक करें।'))); bad = true; }
  if (bad) return;
  const txt = `${t(L('To Ink & Equity, Lucknow', 'इंक एंड इक्विटी, लखनऊ को'))}\n${t(L('Name', 'नाम'))}: ${name}\n${t(L('Phone', 'फ़ोन'))}: ${phone || '-'}\n${t(L('Email', 'ईमेल'))}: ${email || '-'}\n${t(L('Area', 'क्षेत्र'))}: ${topic ? t(PBY[topic].name) : '-'}\n\n${msg}\n\n${t(L('I agree that the firm may use these details only to reply to this message.', 'मैं सहमत हूँ कि फर्म इन विवरणों का उपयोग केवल इस संदेश का उत्तर देने के लिए करे।'))}`;
  S.preview = txt;
  document.getElementById('cpreview').innerHTML = `<div class="preview">${esc(txt)}</div><p style="margin-top:12px"><button class="btn ghost" data-act="copy" data-arg="${esc(txt).replace(/\n/g, '&#10;')}">${esc(t(L('Copy message', 'संदेश कॉपी करें')))}</button></p><p class="why">${esc(t(L('Nothing has been sent. Copy this and send it by phone or email once the firm’s email address is published.', 'कुछ भी भेजा नहीं गया है। इसे कॉपी करें और फर्म का ईमेल पता प्रकाशित होने पर फ़ोन या ईमेल से भेजें।')))}</p>`;
});

/* ---------- boot ---------- */
(function boot() {
  const h = (location.hash || '').replace('#', '');
  if (ROUTES.includes(h)) S.route = h;
  render();
})();

</script>
